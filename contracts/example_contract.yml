# modelgen data contract. Open Data Contract Standard (ODCS) v3.0.2.
# Source-of-truth for one event/entity. Source teams maintain this as part of
# their release process.
#
# modelgen reads the ODCS subset it needs and carries its BigQuery/dbt
# specifics in customProperties:
#   - property.physicalName  = the SOURCE column name (whatever case the
#                              source uses). property.name = the stable,
#                              consumer-facing staging name.
#   - property.physicalType  = the BigQuery type staging casts to.
#   - property.primaryKey    = contributes to the dbt unique_key (source names).
#   - required/unique/validValues map to dbt not_null/unique/accepted_values.
#   - schema.customProperties carries modelgenLoadedAtField + the raw/staging
#     dbt layer config (dataset, materialization, partitioning, dedup).
#   - modelgenExempt opts out of one lint rule and requires a reason. Valid on
#     schema.customProperties (contract-scoped) or on a property's own
#     customProperties (that column only). See docs/linting.md.
#
# Staging materialises as a datestamped daily snapshot: one full copy of the
# dimension per `ds` partition, so history is `where ds = '<date>'` and any
# date backfills in parallel. `materialization: incremental` opts back out.
#
# Classification (ODCS `classification`, pii or psi) drives encryption at
# generation time, the same seam that turns `required: true` into a
# not_null test with no human in the loop. A classified property is
# encrypted on the way into staging and never materialised in plaintext.
# Erasure is one DELETE from the keystore. See docs/bigquery/keystore.md.
#
# Schema evolution:
#   - NEW source columns: appear in raw automatically. Invisible in staging
#     until added here as a property.
#   - RENAMED source column: update the property's physicalName (and the
#     primaryKey property if applicable). The staging `name` stays stable.
#   - RETYPED source column: update the property's physicalType. The staging
#     CAST absorbs the change.
#
# Generate:
#   modelgen gen contract.yml --raw     -o ./models/raw
#   modelgen gen contract.yml --staging -o ./models/staging

version: "1.0.0"
kind: DataContract
apiVersion: v3.0.2
id: 8b1f6c2e-5a3d-4e7a-9f21-3c4d5e6f7a8b
status: active
name: user_signed_up

description:
  purpose: "Fired when a user completes the signup flow."

servers:
  - server: landing
    type: bigquery
    project: my-gcp-project
    dataset: landing

schema:
  - name: user_signed_up
    physicalName: user_signups_raw
    physicalType: table
    description: "Fired when a user completes the signup flow."

    # modelgen-specific dbt/layer config. Origin Data Product (raw) is a
    # pass-through with optional dedup; Consumption Data Product (staging) is
    # the stable contract whose renames and casts absorb upstream drift.
    customProperties:
      - property: modelgenLoadedAtField
        value: RECEIVED_AT
      # The SOURCE column identifying the data subject. Encrypted
      # deterministically, and the keystore lookup for every other
      # classified column on the row.
      - property: modelgenSubjectField
        value: USER_ID
      - property: modelgenRaw
        value:
          dataset: raw
          incrementalStrategy: merge
          dedup: true
          partitionBy:
            field: RECEIVED_AT
            dataType: timestamp
            granularity: day
          clusterBy: [USER_ID]
          # dbt source freshness. The landing table loads hourly, so
          # half a day behind is worth a look and a full day is broken.
          freshness:
            warnAfter: {count: 12, period: hour}
            errorAfter: {count: 24, period: hour}
      - property: modelgenStaging
        value:
          dataset: staging
          materialization: snapshot
          # Not user_id: it is classified, so it lands as BYTES and
          # BigQuery cannot cluster on BYTES.
          clusterBy: [event_id]

    properties:
      - name: event_id
        physicalName: EVENT_ID
        logicalType: string
        physicalType: STRING
        description:
          "Idempotency key for this signup event. Unique per emission,
           stable across replays, and the join key downstream."
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true

      - name: user_id
        physicalName: USER_ID
        logicalType: string
        physicalType: STRING
        description:
          "Account that completed signup. Encrypted deterministically,
           so joins and distinct counts still work on the ciphertext."
        required: true
        # The subject. DETERMINISTIC_ENCRYPT keeps ciphertext stable per
        # keyset, so joins and counts survive the crypto-shred.
        classification: pii

      - name: signup_method
        physicalName: SIGNUP_METHOD
        logicalType: string
        physicalType: STRING
        description:
          "Which signup route the user came through. Constrained to the
           validValues below; a new route needs a contract change."
        required: true
        quality:
          - type: library
            rule: validValues
            validValues: ["email", "google", "apple"]

      - name: received_at
        physicalName: RECEIVED_AT
        logicalType: date
        physicalType: TIMESTAMP
        description:
          "When the ingestion pipeline received the event, not when the
           user acted. Drives the incremental high-water mark."
        required: true

      - name: country_code
        physicalName: COUNTRY_CODE
        logicalType: string
        physicalType: STRING
        description:
          "ISO 3166-1 alpha-2 country the signup came from, resolved at
           ingestion. Null when the IP lookup found nothing."
        # Payload. Randomised AEAD.ENCRYPT, so there is no stable
        # ciphertext to correlate across rows.
        classification: psi
