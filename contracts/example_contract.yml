# modelgen data contract — Open Data Contract Standard (ODCS) v3.0.2.
# Source-of-truth for one event/entity. Source teams maintain this as part of
# their release process.
#
# modelgen reads the ODCS subset it needs and carries its BigQuery/dbt
# specifics in customProperties:
#   - property.physicalName  = the SOURCE column name (whatever case the
#                              source uses). property.name = the stable,
#                              consumer-facing staging name.
#   - property.physicalType  = the BigQuery type staging casts to.
#   - property.primaryKey    = contributes to the dbt unique_key (source names).
#   - required/unique/validValues map to dbt not_null/unique/accepted_values.
#   - schema.customProperties carries modelgenLoadedAtField + the raw/staging
#     dbt layer config (dataset, incremental strategy, partitioning, dedup).
#
# Schema evolution:
#   - NEW source columns: appear in raw automatically. Invisible in staging
#     until added here as a property.
#   - RENAMED source column: update the property's physicalName (and the
#     primaryKey property if applicable). The staging `name` stays stable.
#   - RETYPED source column: update the property's physicalType. The staging
#     CAST absorbs the change.
#
# Generate:
#   modelgen gen contract.yml --raw     -o ./models/raw
#   modelgen gen contract.yml --staging -o ./models/staging

version: "1.0.0"
kind: DataContract
apiVersion: v3.0.2
id: 8b1f6c2e-5a3d-4e7a-9f21-3c4d5e6f7a8b
status: active
name: user_signed_up

description:
  purpose: "Fired when a user completes the signup flow."

servers:
  - server: landing
    type: bigquery
    project: my-gcp-project
    dataset: landing

schema:
  - name: user_signed_up
    physicalName: user_signups_raw
    physicalType: table
    description: "Fired when a user completes the signup flow."

    # modelgen-specific dbt/layer config. Origin Data Product (raw) is a
    # pass-through with optional dedup; Consumption Data Product (staging) is
    # the stable contract whose renames and casts absorb upstream drift.
    customProperties:
      - property: modelgenLoadedAtField
        value: RECEIVED_AT
      - property: modelgenRaw
        value:
          dataset: raw
          incrementalStrategy: merge
          dedup: true
          partitionBy:
            field: RECEIVED_AT
            dataType: timestamp
            granularity: day
          clusterBy: [USER_ID]
      - property: modelgenStaging
        value:
          dataset: staging
          incrementalStrategy: merge
          partitionBy:
            field: received_at
            dataType: timestamp
            granularity: day
          clusterBy: [user_id]

    properties:
      - name: event_id
        physicalName: EVENT_ID
        logicalType: string
        physicalType: STRING
        description: "Unique identifier for this event."
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true

      - name: user_id
        physicalName: USER_ID
        logicalType: string
        physicalType: STRING
        description: "The ID of the user who signed up."
        required: true

      - name: signup_method
        physicalName: SIGNUP_METHOD
        logicalType: string
        physicalType: STRING
        description: "How the user signed up."
        required: true
        quality:
          - type: library
            rule: validValues
            validValues: ["email", "google", "apple"]

      - name: received_at
        physicalName: RECEIVED_AT
        logicalType: date
        physicalType: TIMESTAMP
        description: "When the event was received by the ingestion pipeline."
        required: true

      - name: country_code
        physicalName: COUNTRY_CODE
        logicalType: string
        physicalType: STRING
        description: "ISO 3166-1 alpha-2 country code."
