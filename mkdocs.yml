site_name: Wraith Modelgen CLI
site_description: DBT Model Generator
site_author: Thomas Peoples
repo_url: https://git.thomaspeoples.com/thomaspeoples/wraith-modelgen
edit_uri: edit/main/docs/
site_url: https://www.thomaspeoples.com/gitea-repos/wraith-modelgen/
use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - Home: index.md
  - Usage: usage.md
  - Technical Reference: reference.md
  - Architecture: architecture.md
  - Security Statement: security.md
  - BigQuery Engineering:
    - Overview: bigquery/overview.md
    - Architecture: bigquery/architecture.md
    - Table Creation: bigquery/table-creation.md
    - Historical Backfill: bigquery/historical-backfill.md
    - SCD Type 2: bigquery/scd2.md
    - Tooling Decisions: bigquery/decisions.md

plugins:
  - search

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details

extra:
  links:
    - icon: material/home
      link: https://www.thomaspeoples.com/
      name: Back to Main Site
