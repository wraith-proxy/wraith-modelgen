site_name: Wraith Modelgen CLI
site_description: Turns ODCS data contracts into dbt files. Part of the Ghost Stack.
site_author: Thomas Peoples
repo_url: https://git.thomaspeoples.com/thomaspeoples/wraith-modelgen
repo_name: thomaspeoples/wraith-modelgen
edit_uri: edit/main/docs/
site_url: https://www.thomaspeoples.com/gitea-repos/wraith-modelgen/
use_directory_urls: true
copyright: Part of the Ghost Stack. Sovereign. Self-hosted. No nonsense.

theme:
  name: material
  language: en
  # Sovereign: no Google Fonts. System font stacks are set in docs/stylesheets/extra.css.
  font: false
  logo: assets/ghost.svg
  favicon: assets/favicon.svg
  icon:
    repo: simple/gitea
  palette:
    # Colours for both schemes live in docs/stylesheets/extra.css (primary/accent: custom).
    # Dark is listed first with no media query, so every first-time visitor gets
    # dark whatever their system setting. The toggle switches and is remembered.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    # Wayfinding
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    # Speed: single-page navigation, prefetch on hover, progress bar on slow links.
    # Any script added later must subscribe to Material's document$ observable.
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - toc.follow
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/extra.css

# Order follows the reader: what it is and how to install, how to drive it,
# what contracts and generated files look like, the BigQuery engineering behind
# the defaults, then the security statement. Page files and URLs are unchanged.
nav:
  - Overview: index.md
  - Guide:
    - Commands & Configuration: usage.md
    - Lint Rules: linting.md
  - Reference:
    - Contracts, Layers & Dialects: reference.md
    - Architecture: architecture.md
    - Python API: api.md
    - Compatibility: compatibility.md
  - BigQuery Engineering:
    - Overview: bigquery/overview.md
    - Warehouse Architecture: bigquery/architecture.md
    - Table Creation: bigquery/table-creation.md
    - Historical Backfill: bigquery/historical-backfill.md
    - SCD Type 2: bigquery/scd2.md
    - Keystore & Erasure: bigquery/keystore.md
    - Tooling Decisions: bigquery/decisions.md
  - Security: security.md

# Agent-facing notes stay published at their URLs but out of the reader's nav.
not_in_nav: |
  /agents/

# Snippet-only file: appended to every page by pymdownx.snippets, never a page.
exclude_docs: |
  /assets/abbreviations.md

# Broken links and anchors surface as WARNING lines in the build.
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search:
      lang: en
      # Also split on underscores, dots and camelCase, so user_signups,
      # servers[].type and modelgenLoadedAtField are findable by any part.
      separator: '[\s\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # Bundled with mkdocs-material. At BUILD time it downloads every third-party
  # asset (Mermaid from unpkg, the shields.io badges on the home page) into
  # assets/external/ and rewrites the references, so the published site makes
  # no third-party request. Needs network on a cold cache (.cache/, gitignored).
  - privacy:
      assets_fetch_dir: assets/external

# Defines `mermaid` before Material's bundle runs, so Material never fetches
# its own copy from unpkg. See docs/javascripts/vendor/SOURCE.txt.
extra_javascript:
  - javascripts/vendor/mermaid.min.js

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      # Glossary terms and acronyms get a hover definition on every page.
      auto_append:
        - docs/assets/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - admonition
  - abbr
  - toc:
      permalink: "#"
      permalink_title: Link to this section

extra:
  social:
    - icon: material/home
      link: https://www.thomaspeoples.com/
      name: Back to Main Site
    - icon: simple/gitea
      link: https://git.thomaspeoples.com/thomaspeoples/wraith-modelgen
      name: Source on Gitea
    - icon: material/bug-outline
      link: https://git.thomaspeoples.com/thomaspeoples/wraith-modelgen/issues
      name: Issues
