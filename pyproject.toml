[project]
name = "modelgen"
version = "0.3.0"
description = "BigQuery dbt model scaffolder from YAML data contracts. Generates Origin and Consumption Data Products with auto-introspection."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "google-cloud-bigquery>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
modelgen = "modelgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelgen"]
