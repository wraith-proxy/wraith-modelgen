[project]
name = "wraith-modelgen"
version = "0.20.0"
description = "dbt scaffolding from ODCS data contracts for BigQuery and DuckDB."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Peoples", email = "hello@thomaspeoples.com" },
]
keywords = ["dbt", "bigquery", "duckdb", "odcs", "data-contracts", "scaffold", "analytics-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "google-cloud-bigquery>=3.20",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "genbadge[coverage]>=1.1.3",
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "poethepoet",
    "pydoc-markdown",
    "typer",
    "detect-secrets",
]

[project.urls]
Homepage = "https://git.thomaspeoples.com/thomaspeoples/wraith-modelgen"
Repository = "https://git.thomaspeoples.com/thomaspeoples/wraith-modelgen.git"
Documentation = "https://www.thomaspeoples.com/gitea-repos/wraith-modelgen/"
Issues = "https://git.thomaspeoples.com/thomaspeoples/wraith-modelgen/issues"
Changelog = "https://git.thomaspeoples.com/thomaspeoples/wraith-modelgen/src/branch/main/CHANGELOG.md"

[project.scripts]
modelgen = "modelgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelgen"]

[tool.poe.tasks]
setup = "python tasks.py"
test = "pytest"
test-ci = "pytest --cov=src tests/ --cov-report=term-missing --cov-fail-under=80"
lint = "ruff check ."
format = "ruff format ."
tidy = ["lint", "format"]
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"

[tool.pydoc-markdown]
loaders = [
    { type = "python", search_path = ["src/"] }
]
renderer = {type = "markdown"}

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--tb=short",
    "--strict-markers",
]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = [
    "src/modelgen/__init__.py",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
]

[tool.uv]
override-dependencies = ["black>=26.10.1"]
