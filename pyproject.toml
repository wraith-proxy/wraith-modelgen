[project]
name = "modelgen"
version = "0.3.0"
description = "BigQuery dbt model scaffolder from YAML data contracts. Generates Data Products with auto introspection."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "google-cloud-bigquery>=3.20",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "poethepoet",
    "pydoc-markdown",
    "typer",
]

[project.scripts]
modelgen = "modelgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelgen"]

[tool.poe.tasks]
setup = "python tasks.py"
test = "pytest"
test-ci = "pytest --cov=src tests/ --cov-report=term-missing --cov-fail-under=80"
lint = "ruff check ."
format = "ruff format ."
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"

[tool.pydoc-markdown]
loaders = [
    { type = "python", search_path = ["src/"] }
]
renderer = {type = "markdown"}

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--tb=short",
    "--strict-markers",
]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = [
    "src/modelgen/__init__.py",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I"]
