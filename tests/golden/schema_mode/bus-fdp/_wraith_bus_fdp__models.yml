    every date from two days before the newest one the table already held, older
    dates stay as they were last written, and the post-hook keeps history_days()
    of them. A plain FULL_REFRESH=1 keeps it; an ops/incident.py replay rebuilds
    it from data/. The model header has the rewrite arithmetic; ADR-0010 has the
    why.'
