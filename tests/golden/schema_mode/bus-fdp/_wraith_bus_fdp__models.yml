- name: int_journey_delays
  description: 'One row per journey line_punctuality aggregates: how late it finished
    against its scheduled arrival, filed under the local date it finished on. The
    three filters on which journeys count -- a scheduled arrival, a feed-tagged direction,
    a delay inside plus or minus two hours -- are the ones line_punctuality applied
    to int_journeys_shaped_and_directed before ADR-0010, now applied here. Kept for
    history_days() by stats_date, for the same reason as int_eta_daily_stats: the
    journeys it comes from are pruned along with their pings, which only go back
