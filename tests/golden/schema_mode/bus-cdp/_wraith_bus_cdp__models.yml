models:
- name: stg_bods__vehicle_pings
  description: Every usable bus position observation, one row per vehicle per 3-minute
    bucket. This is the grain the whole project is built on. Staging does rename,
    cast and per-row derivation only -- no joins and no aggregation -- so that when
    a number downstream looks wrong there is exactly one place where a type or a
    unit could have gone astray. Rows outside the Great Britain bounding box or at
    (0, 0) are dropped here rather than downstream, because a single unfixed-GPS
    ping adds thousands of kilometres to a journey's measured path.
  config:
    contract:
      enforced: true
  meta:
    consumes:
    - bus-positions-extract.bus_positions.timestamp
    - bus-positions-extract.bus_positions.bus_id
    - bus-positions-extract.bus_positions.line
