    - bus-positions-extract.bus_positions.origin_ref
    - bus-positions-extract.bus_positions.origin_name
    - bus-positions-extract.bus_positions.dest_ref
    - bus-positions-extract.bus_positions.dest_name
    - bus-positions-extract.bus_positions.origin_aimed_dep
    - bus-positions-extract.bus_positions.dest_aimed_arr
    - bus-positions-extract.bus_positions.recorded_at
  columns:
  - name: bus_id
    description: The operator's own vehicle reference. NOT a key and NOT globally
      unique -- operators mint these independently, so '3104' is fifteen different
      physical buses in fifteen different towns. int_pings_segmented_to_journeys
      has to defend against that.
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: line
    description: 'Public service number as shown on the blind. Also not globally
      unique: dozens of operators run a route called ''1''. Treat a line here as
      "a service number", not "a route".'
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: feed_direction
    description: The feed's own DirectionRef, normalised to a known token, or NULL
      when the feed did not give one -- which is every row collected before 2026-09-12.
      Deliberately left NULL rather than defaulted, so that int_journeys_shaped_and_directed
      can tell "the operator says inbound" apart from "we guessed inbound", and so
      that a coalesce to '*' cannot quietly collapse every journey into one direction
      bucket.
    data_type: VARCHAR
  - name: operator
    description: NOC of the operating company. NULL before 2026-09-12; the only thing
      that could disambiguate colliding bus_ids.
    data_type: VARCHAR
  - name: recorded_at
    description: The feed's own per-record observation time, epoch MILLIS; often
      stale, used only as a sort tiebreak in int_pings_segmented_to_journeys. NULL
      before extract.py carried it (2026-09-20). Not described in the staging yml.
    data_type: BIGINT
  - name: journey_ref
    description: DatedVehicleJourneyRef -- the operator's identifier for this specific
      scheduled run. When present it is the authoritative journey boundary and int_pings_segmented_to_journeys
      prefers it over any heuristic. NULL before 2026-09-12.
    data_type: VARCHAR
  - name: origin_ref
    description: NaPTAN ATCOCode of the scheduled origin stop; joins directly to
      stg_naptan__stops.atco_code.
    data_type: VARCHAR
  - name: origin_name
    description: Free-text origin as the operator publishes it, for display only
      -- never matched on.
    data_type: VARCHAR
  - name: dest_ref
    description: NaPTAN ATCOCode of the scheduled destination stop.
    data_type: VARCHAR
  - name: dest_name
    description: Free-text destination as shown on the blind, for display only.
    data_type: VARCHAR
  - name: ping_ts
    description: 'End of the 3-minute sample bucket in UTC, as a naive TIMESTAMP.
      The canonical instant: everything that is compared, differenced or published
      uses this. Obtained with an explicit AT TIME ZONE ''UTC'' so the build does
      not depend on the host''s time zone.'
    data_type: TIMESTAMP
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: ping_local_ts
    description: 'The same instant as Europe/London wall-clock time. Exists because
      every temporal BUCKET has to be local: the UK runs UTC+1 from late March to
      late October, so bucketing on UTC puts the morning peak an hour early and files
      a 00:30 Saturday ping under Friday. hour_of_day, hour_band, day_type and ping_local_date
      all derive from this column and never from ping_ts.'
    data_type: TIMESTAMP
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: ping_date
    description: Calendar date of the ping, used only for eyeballing coverage per
      extracted day.
    data_type: DATE
  - name: ping_local_date
    description: Local calendar date. The date a passenger would call it, which is
      the one that matters for day_type.
    data_type: DATE
  - name: hour_of_day
    description: LOCAL hour 0-23. Kept alongside hour_band so an analysis can re-band
      without re-deriving.
    data_type: INTEGER
  - name: hour_band
    description: Traffic-regime bucket, derived from LOCAL time. Buses behave completely
      differently at 08:00 and at 02:00, so the ETA regression is fitted per band
      rather than pooled. FROZEN to match backend/app.py -- see macros/hour_band.sql.
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: day_type
    description: 'Service pattern of the local date: ''weekday'', ''sat'' or ''sun''.
      Weekend bus operation differs from Mon-Fri in frequency, stops served and traffic,
      so it is the third dimension of the ETA model''s grain. Bank holidays are filed
      as ''weekday'' -- see macros/day_type.sql. The one bank holiday inside the
      current extract window (2026-08-31) is excluded outright in this model rather
      than mislabelled.'
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: lat
    description: WGS84 latitude, guaranteed inside the GB bounding box.
    data_type: DOUBLE
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: lon
    description: WGS84 longitude, guaranteed inside the GB bounding box.
    data_type: DOUBLE
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: bearing
    description: Compass heading reported by the vehicle. Carried for the map arrow
      only -- it is the instantaneous heading, not the direction of the journey,
      so it is useless for direction inference.
    data_type: DOUBLE
  - name: origin_aimed_dep_ts
    description: Scheduled departure from origin, converted from the feed's epoch
