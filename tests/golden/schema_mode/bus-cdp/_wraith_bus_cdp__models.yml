    data_type: TIMESTAMP
  - name: dest_aimed_arr_ts
    description: Scheduled arrival at destination, converted from epoch MILLIS. The
      only input to line_punctuality, and NULL before 2026-09-12.
    data_type: TIMESTAMP
- name: stg_naptan__stops
  description: 'NaPTAN narrowed to active bus stops with usable coordinates, and
    typed. Everything that needs a stop joins here rather than to the raw CSV, so
    the "what counts as a bus stop" decision lives in exactly one place. About 344k
    of NaPTAN''s 435k rows survive; the rest are rail, ferry, air and metro nodes,
    or stops marked deleted. Reads the raw NaPTAN CSV via source(''naptan'',''stops'')
    (all_varchar), which has no contract yet, so this table declares no `consumes`;
    raw columns read: ATCOCode, CommonName, StopType, TimingStatus, Status, Latitude,
    Longitude, LocalityName, Town, ParentLocalityName.'
  config:
    contract:
      enforced: true
  columns:
  - name: atco_code
    description: National stop identifier. The join key to the feed's origin_ref
      and dest_ref, and the primary key here.
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
    - unique
  - name: stop_name
    description: CommonName as published. Not unique -- both sides of a road share
      a name and differ only by ATCOCode.
    data_type: VARCHAR
  - name: stop_type
    description: NaPTAN StopType, constrained to the four bus varieties. Kept so
      a future filter change is auditable against what was actually let through.
    data_type: VARCHAR
  - name: timing_status
    description: Whether the stop is a timing point on the published timetable. Not
      used yet; the natural input if stop sequences ever need anchoring to real schedule
      times.
    data_type: VARCHAR
  - name: status
    description: NaPTAN lifecycle status, always 'active' here by construction.
    data_type: VARCHAR
  - name: lat
    description: WGS84 latitude, non-null and inside the GB bounding box.
    data_type: DOUBLE
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: lon
    description: WGS84 longitude, non-null and inside the GB bounding box.
    data_type: DOUBLE
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: locality
    description: 'Human-readable place, coalesced down NaPTAN''s three-level locality
      hierarchy (LocalityName, then Town, then ParentLocalityName). The coalesce
      matters: a stop in an unnamed hamlet still has to resolve to a place a user
      would plausibly type.'
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: locality_norm
    description: The search key. Uppercased, punctuation stripped, spaces collapsed,
      so that "ASHTON UNDER LYNE" typed into the box matches "Ashton-under-Lyne"
      in the register. Frozen in CONTRACT.md s2 because backend/app.py normalises
      the query the same way.
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
