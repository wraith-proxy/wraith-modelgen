    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: slope_s_per_km
    description: Regression slope. Seconds of running time per kilometre still to
      go, inclusive of stop dwell, which is why it reads far slower than road speed.
      Fitted on along-route distance, so a consumer holding only a straight line
      must scale it up by the detour factor first.
    data_type: DOUBLE
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: intercept_s
    description: 'Regression intercept, around 400-750 s. It absorbs end-of-journey
      behaviour -- terminus approach and dwell -- because the target is the journey''s
      last ping rather than the moment of arrival. CONSUMER WARNING: this makes the
      model unsuitable for computing lateness; it reads about 7 minutes late when
      checked against buses observed standing at their destination. Use it for a
      rough ETA only.'
    data_type: DOUBLE
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: r2
    description: Coefficient of determination for this grain. Surfaced to end users
