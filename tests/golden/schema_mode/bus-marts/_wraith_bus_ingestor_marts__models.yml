  columns:
  - name: operator
    description: National Operator Code, or '*' for a fit pooled across every operator.
      Added 2026-09-12; null in the source feed before that date, so every historical
      ping can only ever feed the '*' rows.
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: line
    description: Published service number as the operator advertises it, or '*' for
      the global fallback row.
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: direction
    description: 'Direction of travel, straight from the feed''s DirectionRef. Never
      NULL: a journey the feed didn''t tag is excluded from a direction-grained rung
      rather than published with one, the same way a journey with no operator is
      excluded from an operator-grained rung (see the `null_guards` comment in eta_models.sql).
      Inferred from journey geometry until 2026-09-23, when that heuristic was measured
      against the feed''s own value and retired -- see docs/ROADMAP.md 1.2.0.'
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: day_type
    description: Service day class, derived from the LOCAL (Europe/London) date.
      Saturday and Sunday timetables differ from Monday-Friday in both frequency
      and running time. Bank holidays are not detected and file as 'weekday'.
    data_type: VARCHAR
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: hour_band
    description: Local-time band. night 22:00-05:59, am_peak 06:00-09:59, inter 10:00-15:59,
      pm_peak 16:00-18:59, evening 19:00-21:59. MUST match the consumer's banding
