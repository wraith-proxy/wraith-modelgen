version: 2

models:
  - name: stg__user_signed_up
    description: "Consumption Data Product. Stable contract for user_signed_up. Casts and renames here absorb upstream schema drift so downstream FDPs do not break."
    config:
      materialized: incremental
      incremental_strategy: insert_overwrite
      schema: staging
    columns:
      - name: event_id
        data_type: STRING
        description: "Unique identifier for this event."
        tests:
          - not_null
          - unique:
              config: {"where": "ds = date('{{ var(\"ds\", run_started_at.strftime(\"%Y-%m-%d\")) }}')"}
      - name: user_id
        data_type: BYTES
        description: "The ID of the user who signed up."
        meta:
          classification: pii
          encrypted: true
        tests:
          - not_null
      - name: signup_method
        data_type: STRING
        description: "How the user signed up."
        tests:
          - not_null
          - accepted_values:
              values: ["email", "google", "apple"]
      - name: received_at
        data_type: TIMESTAMP
        description: "When the event was received by the ingestion pipeline."
        tests:
          - not_null
      - name: country_code
        data_type: BYTES
        description: "ISO 3166-1 alpha-2 country code."
        meta:
          classification: psi
          encrypted: true
      - name: ds
        data_type: DATE
        description: "Snapshot date. One full copy of the dimension per ds."
        tests:
          - not_null
