# modelgen data contract
# Source-of-truth for one event/entity. Source teams maintain this as part of
# their release process. Schema evolution rules:
#   - NEW source columns: appear in raw automatically (select *). Invisible in
#     staging until added to the contract. Downstream never sees what it doesn't
#     yet know to consume.
#   - RENAMED source column: update both `unique_key` (if applicable) and the
#     staging column's `source:` field. Staging name stays stable downstream.
#   - RETYPED source column: update the staging column's `type:` field. The
#     CAST in staging absorbs the change.
#
# Naming convention: `unique_key` and `loaded_at_field` reference SOURCE column
# names (whatever case the source uses). Staging columns declare the consumer-
# facing name separately.
#
# Generate:
#   modelgen gen contract.yml --raw     -o ./models/raw
#   modelgen gen contract.yml --staging -o ./models/staging

version: "1"

event:
  name: user_signed_up
  description: "Fired when a user completes the signup flow."

  unique_key: EVENT_ID                 # source column. Composite: [EVENT_ID, USER_ID]
  loaded_at_field: RECEIVED_AT         # source column

  source:
    project: my-gcp-project
    dataset: landing
    table: user_signups_raw

  # Origin Data Product. Owned by the source team. Pass-through with optional
  # dedup. Schema mirrors source; new columns flow through automatically.
  raw:
    dataset: raw
    incremental_strategy: merge
    dedup: true
    partition_by:
      field: RECEIVED_AT
      data_type: timestamp
      granularity: day
    cluster_by: [USER_ID]

  # Consumption Data Product. Stable contract for downstream FDPs.
  # Renames and casts here absorb upstream schema drift.
  staging:
    dataset: staging
    incremental_strategy: merge
    partition_by:
      field: received_at               # staging-side name (post-rename)
      data_type: timestamp
      granularity: day
    cluster_by: [user_id]

    columns:
      - source: EVENT_ID
        name: event_id
        type: STRING
        description: "Unique identifier for this event."
        tests:
          - not_null
          - unique

      - source: USER_ID
        name: user_id
        type: STRING
        description: "The ID of the user who signed up."
        tests:
          - not_null

      - source: SIGNUP_METHOD
        name: signup_method
        type: STRING
        description: "How the user signed up."
        tests:
          - not_null
          - accepted_values:
              values: ["email", "google", "apple"]

      - source: RECEIVED_AT
        name: received_at
        type: TIMESTAMP
        description: "When the event was received by the ingestion pipeline."
        tests:
          - not_null

      - source: COUNTRY_CODE
        name: country_code
        type: STRING
        description: "ISO 3166-1 alpha-2 country code."
