name: Deploy Gitea Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Tests & Coverage
        run: uv run pytest --cov=src --cov-report=xml

      - name: Generate Coverage Badge
        run: uv run genbadge coverage -i coverage.xml -o docs/coverage.svg

      - name: Build Documentation
        run: uv run mkdocs build

      - name: Guard against third-party requests
        run: |
          set -euo pipefail
          # Sovereign: the published site must not load anything from a third-party host.
          # Matches real URLs (//host), so the privacy plugin's local copies under
          # assets/external/<host>/ do not count. Source maps are skipped: never executed.
          test -d site
          HOSTS='unpkg\.com|img\.shields\.io|fonts\.googleapis|fonts\.gstatic|cdn\.jsdelivr'
          # The one allowed reference: Material's bundled ResizeObserver polyfill loader,
          # only ever requested by pre-2020 browsers.
          ALLOWED='^site/assets/javascripts/bundle\.[0-9a-f]+\.min\.js:https://unpkg\.com/resize-observer-polyfill$'
          HITS=$(grep -rIoE --exclude='*.map' "(https?:)?(//|\\\\/\\\\/)($HOSTS)[^\"'\`<> )]*" site | grep -vE "$ALLOWED" || true)
          if [ -n "$HITS" ]; then
            echo "Third-party references found in the built site:"
            echo "$HITS"
            exit 1
          fi
          echo "No third-party references in the built site."

      - name: Sync to Main Website Repo
        env:
          MY_TOKEN: ${{ secrets.GITEATOKEN }}
          MY_URL: ${{ secrets.GITEAURL }}

        run: |
          # 1. Clone your main website repo
          CLEAN_URL=$(echo $MY_URL | sed -e 's|^[^/]*//||')
          git clone https://${MY_TOKEN}@${CLEAN_URL}/thomaspeoples/ghost-site.git main_site

          # 2. Create the target directory if it doesn't exist
          TARGET_DIR="main_site/www/thomaspeoples/gitea-repos/wraith-modelgen"
          mkdir -p $TARGET_DIR

          # 3. Clean and Copy
          rm -rf $TARGET_DIR/*
          cp -r site/* $TARGET_DIR/

          # 4. Commit and Push to the OTHER repo
          cd main_site
          git config user.name "Ghost Runner"
          git config user.email "runner@ghost-stack.local"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to documentation. Skipping commit."
          else
            git commit -m ":books: main: Update docs for wraith-modelgen: ${{ gitea.sha }}"
            git push origin main
          fi
